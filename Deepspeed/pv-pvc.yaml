apiVersion: v1
kind: PersistentVolume
metadata:
  name: ds-offload-new2
spec:
  capacity:
    storage: 10Gi   # new2 has no dedicated NVMe — this is carved from its
                     # root disk (/dev/vda1), which has limited free space.
                     # Fine for the 0.5B test; revisit before scaling up.
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-hostpath
  hostPath:
    path: /mnt/ds-offload
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - new2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ds-offload-pvc
  namespace: llm-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hostpath
  resources:
    requests:
      storage: 10Gi
